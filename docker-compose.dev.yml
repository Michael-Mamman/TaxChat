services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: taxchat-mongo-dev
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data-dev:/data/db
    environment:
      MONGO_INITDB_DATABASE: taxchat
    networks:
      - taxchat-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # TaxChat Application (Development Mode) 
  app:
    image: node:20-slim
    container_name: taxchat-app-dev
    restart: unless-stopped
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=development
      - MONGO_URI_LOCAL=mongodb://mongo:27017/taxchat
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./package.json:/app/package.json
      - ./package-lock.json:/app/package-lock.json
      - ./tsconfig.json:/app/tsconfig.json
      - ./eng.traineddata:/app/eng.traineddata
      - ./uploads:/app/uploads
      - node_modules:/app/node_modules
    command: >
      sh -c "
        apt-get update && apt-get install -y libcairo2 libpango-1.0-0 libpangocairo-1.0-0 libjpeg62-turbo libgif7 librsvg2-2 fonts-dejavu fonts-liberation &&
        npm install &&
        npm run dev
      "
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - taxchat-network

networks:
  taxchat-network:
    driver: bridge

volumes:
  mongo-data-dev:
    driver: local
  node_modules:
    driver: local
