services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: taxchat-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: taxchat
    networks:
      - taxchat-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # TaxChat Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: taxchat-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    env_file:
      - .env
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - taxchat-network
    healthcheck:
      test: [ "CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})" ]
      interval: 30s
      timeout: 3s
      start_period: 40s
      retries: 3

networks:
  taxchat-network:
    driver: bridge

volumes:
  mongo-data:
    driver: local
